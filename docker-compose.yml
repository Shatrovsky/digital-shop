version: "3.10"

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: secret
        ports:
            - "5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build: .
        volumes:
            - .:/var/www/html
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: app
            DB_USERNAME: app
            DB_PASSWORD: secret
        depends_on:
            postgres:
                condition: service_healthy
        command: php-fpm

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    queue_webhooks:
        build: .
        restart: always
        volumes:
            - .:/var/www/html
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: app
            DB_USERNAME: app
            DB_PASSWORD: secret
        depends_on:
            postgres:
                condition: service_healthy
        command: php artisan queue:work --queue=webhooks --sleep=1 --tries=3 --max-time=300

    queue_delivery:
        build: .
        restart: always
        volumes:
            - .:/var/www/html
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: app
            DB_USERNAME: app
            DB_PASSWORD: secret
        depends_on:
            postgres:
                condition: service_healthy
        command: php artisan queue:work --queue=delivery --sleep=1 --tries=3 --max-time=300

    scheduler:
        build: .
        volumes:
            - .:/var/www/html
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: app
            DB_USERNAME: app
            DB_PASSWORD: secret
        depends_on:
            postgres:
                condition: service_healthy
        command: php artisan schedule:work

volumes:
    pg_data:
